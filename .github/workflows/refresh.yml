# 매일 공식몰·판매처 데이터를 새로 받아 public/data.js를 커밋
name: refresh-data
on:
  schedule:
    - cron: '0 22 * * *' # 한국 시간 07:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node build.mjs
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.js
          git diff --cached --quiet || { git commit -m "data $(date -u +%F)"; git push; }
