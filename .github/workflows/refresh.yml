# 매일 공식몰 데이터를 새로 받아 public/data.js를 커밋 (커밋되면 Cloudflare Pages가 다시 배포)
name: refresh-data
on:
  schedule:
    - cron: '0 22 * * *' # 한국 시간 07:00
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node build.mjs
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.js
          git diff --cached --quiet || { git commit -m "data $(date -u +%F)"; git push; }
